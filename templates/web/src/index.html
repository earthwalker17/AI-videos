<!doctype html>
<!-- The page the web engine captures (video.json entry). Open it through aiv render; the
     harness passes the frame size and rate as ?w=&h=&fps=. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>AI-videos web template</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      body { display: grid; place-items: center; }
      /* only the preview is scaled; the capture reads the canvas at its own size */
      canvas { max-width: 100vw; max-height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="frame"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
