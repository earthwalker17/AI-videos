name: setup
description: Node, pnpm (version from package.json), dependencies from the lockfile, and FFmpeg 8.0 on PATH.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # A static FFmpeg from the 8.0 release branch (the reference host runs 8.0.1). The exact
    # version lands in every render.json, so a drift is visible.
    - name: FFmpeg 8.0 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.0-latest-linux64-gpl-8.0.tar.xz
        mkdir -p "$RUNNER_TEMP/ffmpeg" && tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
        echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
    - name: FFmpeg 8.0 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.0-latest-win64-gpl-8.0.zip -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
        Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
        $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName + '\bin'
        Add-Content -Path $env:GITHUB_PATH -Value $bin
    - run: ffmpeg -hide_banner -version | head -1
      shell: bash
