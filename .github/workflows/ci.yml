name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm aiv check
      # browser integration tests skip themselves here (no pinned browser installed)
      - run: pnpm test

  licences-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fsfe/reuse-action@v5
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The templates end to end on a GPU-less runner: software GL, so pixels differ from a GPU host.
  # QA judges ranges (swatches within ±3, loudness, tags, durations), never bytes.
  render:
    runs-on: ubuntu-latest
    needs: check
    env:
      AIV_ALLOW_SOFTWARE_GL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Browser system libraries
        run: pnpm --filter @aiv/engine-web exec playwright-core install-deps chromium
      - run: pnpm aiv doctor --fix
      - name: web template
        run: |
          pnpm aiv render template:web --profile draft
          pnpm aiv post template:web --profile draft
          pnpm aiv qa template:web --profile draft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-sheets
          path: out/*/qa/*/
          if-no-files-found: ignore
