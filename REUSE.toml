# REUSE 3.3 licensing annotations (https://reuse.software/spec-3.3/).
# Human-readable matrix: docs/LICENSING.md. When several annotations match a file,
# the last one wins; a file's own SPDX header (e.g. adapted code) wins over all of them.
version = 1

# Default: code, configuration, schemas and metadata.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 earthwalker17"
SPDX-License-Identifier = "MIT"

# Prose (docs, knowledge, series/style guides, references, scripts, prompts, skills) and captions.
[[annotations]]
path = ["**/*.md", "**/*.srt", "**/*.vtt", "prompts/**"]
SPDX-FileCopyrightText = "2026 earthwalker17"
SPDX-License-Identifier = "CC-BY-4.0"

# Original media made for this repository (anywhere: assets, publish/ thumbnails, styles).
[[annotations]]
path = [
  "videos/**/assets/**",
  "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.webp", "**/*.gif", "**/*.svg", "**/*.avif",
  "**/*.exr", "**/*.hdr", "**/*.ktx2", "**/*.cube",
  "**/*.wav", "**/*.flac", "**/*.mp3", "**/*.ogg", "**/*.opus", "**/*.m4a",
  "**/*.mp4", "**/*.webm", "**/*.mov",
  "**/*.glb", "**/*.gltf",
]
SPDX-FileCopyrightText = "2026 earthwalker17"
SPDX-License-Identifier = "CC-BY-4.0"

# AI-generated media committed with a provenance sidecar (docs/LICENSING.md, rights class A):
# no copyright claimed. Listed one by one; the sidecar next to each records the model and terms.
[[annotations]]
path = ["videos/halloween-gift/publish/thumbnail.jpg", "videos/super-agent/publish/thumbnail.jpg"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-AI-Output"

# Video #5's thumbnail: AI output with MiniDSH's real mark (MIT) composited over the model's drawing
# of it (publish/thumbnail.provenance.json).
[[annotations]]
path = ["videos/minidsh-launch/publish/thumbnail.jpg"]
SPDX-FileCopyrightText = "2026 MiniDSH contributors"
SPDX-License-Identifier = "LicenseRef-AI-Output AND MIT"

# Video #5: real captures of MiniDSH 2.0.0 (MIT) and its terminal output; its web UI adapts design
# tokens and icons from DeepSeek Harness (MIT). Provenance per file: videos/minidsh-launch/CREDITS.md.
[[annotations]]
path = ["videos/minidsh-launch/assets/ui/**", "videos/minidsh-launch/assets/tui/**", "videos/minidsh-launch/assets/probe/**"]
SPDX-FileCopyrightText = ["2026 MiniDSH contributors", "2026 DeepSeek"]
SPDX-License-Identifier = "MIT"
